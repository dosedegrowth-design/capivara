<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Capivara estilizada para favicon (silhueta simplificada) -->
  <rect width="64" height="64" fill="#FBF6EC" rx="12"/>
  <!-- Corpo -->
  <path d="M 8 36 Q 8 26 16 24 Q 18 18 24 19 Q 26 15 32 15 L 46 15 Q 54 16 56 26 Q 56 38 50 40 L 14 40 Q 8 40 8 36 Z" fill="#C46A3F"/>
  <!-- Orelha -->
  <ellipse cx="26" cy="17" rx="2.5" ry="2" fill="#C46A3F"/>
  <ellipse cx="26" cy="17.5" rx="1.4" ry="1" fill="#8E4628"/>
  <!-- Olho -->
  <circle cx="15" cy="28" r="1.4" fill="#1F1611"/>
  <!-- Patas -->
  <rect x="45" y="38" width="4" height="10" rx="1.5" fill="#8E4628"/>
  <rect x="18" y="38" width="4" height="10" rx="1.5" fill="#8E4628"/>
  <!-- Lupa (signature da Capivara investigando) -->
  <circle cx="6" cy="40" r="6" fill="none" stroke="#1F1611" stroke-width="1.4"/>
  <circle cx="6" cy="40" r="5" fill="#E8A547" opacity="0.4"/>
